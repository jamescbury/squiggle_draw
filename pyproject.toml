[project]
name = "squiggle-draw"
version = "0.1.0"
description = "Generate single line art from photos for AxiDraw plotters"
authors = [
    {name = "James Cbury"}
]
readme = "README.md"
requires-python = "^3.10"
dependencies = [
    "pillow (>=11.3.0,<12.0.0)",
    "numpy (>=2.0,<2.3)",
    "opencv-python-headless (>=4.12.0.88,<5.0.0.0)",
    "svgwrite (>=1.4.3,<2.0.0)",
    "click (>=8.2.1,<9.0.0)",
    "pillow-heif (>=1.0.0,<2.0.0)",
    "scikit-image (>=0.25.2,<0.26.0)",
    "matplotlib (>=3.10.3,<4.0.0)",
    "streamlit (>=1.47.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.2.1"
black = "^25.1.0"
flake8 = "^7.3.0"
mypy = "^1.17.0"

[tool.poetry.scripts]
squiggle-draw = "squiggle_draw.cli.main:cli"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=squiggle_draw --cov-report=html --cov-report=term-missing"